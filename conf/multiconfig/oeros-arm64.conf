# Copyright (c) 2026 Wind River Systems, Inc.
#
# Runtime container images for generic arm64 (SystemReady IR/ES) hosts.
#
# Holds the lean end of the stack: the base container and everything layered on
# ros-core and ros-base.  The graphical and simulation images live in
# oeros-arm64-desktop, which is a separate multiconfig because it needs
# LICENSE_FLAGS_ACCEPTED and x11 that these images should not inherit.

MACHINE = "genericarm64"

require conf/include/oeros-container-mc.inc

# The SDK images are published from the oeros-sdk-* multiconfigs.  Building
# them here is harmless, but they would claim the same repository and tag.
OEROS_CONTAINER_PUBLISH:pn-oeros-container-sdk-cross = "0"
OEROS_CONTAINER_PUBLISH:pn-oeros-container-sdk-target = "0"
