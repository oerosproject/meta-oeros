# Appended to the build's conf/local.conf before yocto-check-layer runs.
#
# yocto-check-layer first runs "bitbake world" with every layer except
# meta-oeros, and that run must succeed before meta-oeros is checked at all.
# A world build fails on any single unbuildable recipe.

# meta-ros generates thousands of recipes from rosdistro, and many of them in
# meta-ros2-lyrical depend on rosdep keys with no OE mapping
# (ROS_UNRESOLVED_DEP-*). meta-ros's own ROS_WORLD_SKIP_GROUPS lists don't
# cover all of them yet, so keep the meta-ros layers' recipes out of the world
# target list. ROS recipes that meta-oeros images depend on are still parsed
# and have their signatures computed.
EXCLUDE_FROM_WORLD:layer-ros-common-layer = "1"
EXCLUDE_FROM_WORLD:layer-ros2-layer = "1"
EXCLUDE_FROM_WORLD:layer-ros2-lyrical-layer = "1"

# Oeros builds with commercial license flags accepted
# (conf/fragments/allow-commercial-licenses.conf). Without them ffmpeg is
# skipped and world recipes such as meta-python-ai's python3-av can't build.
LICENSE_FLAGS_ACCEPTED += "commercial synaptics-killswitch"
