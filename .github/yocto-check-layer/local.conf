# Appended to the build's conf/local.conf before yocto-check-layer runs.
#
# yocto-check-layer first runs "bitbake world" with only meta-oeros's
# dependencies, and that run must succeed before meta-oeros is checked at all.
# Recipes listed here are broken in an upstream dependency layer on its own,
# so they're skipped to give the check a clean baseline. Each entry should
# name the upstream problem so it can be dropped once that's fixed.

# meta-ros2-lyrical (wrynose): openvdb-vendor DEPENDS on
# ROS_UNRESOLVED_DEP-liblzma-dev, which has no rosdep mapping, and
# spatio-temporal-voxel-layer is its only user.
SKIP_RECIPE[openvdb-vendor] = "upstream meta-ros: depends on unresolved ROS_UNRESOLVED_DEP-liblzma-dev"
SKIP_RECIPE[spatio-temporal-voxel-layer] = "upstream meta-ros: depends on openvdb-vendor"
