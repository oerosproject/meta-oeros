# Appended to the build's conf/local.conf before yocto-check-layer runs.
#
# yocto-check-layer first runs "bitbake world" with every layer except
# meta-oeros, and that run must succeed before meta-oeros is checked at all.
# A world build fails on any single unbuildable recipe, and with a dozen
# third-party layers in nodistro some always are (meta-ros recipes with
# unmapped ROS_UNRESOLVED_DEP-* keys, meta-python-ai's pytorch needing the
# opencl distro feature, and so on).
#
# So the workflow also writes EXCLUDE_FROM_WORLD:layer-<collection> = "1" for
# every layer other than oe-core and meta-oeros. World is then oe-core plus
# meta-oeros: recipes from the other layers are still parsed and still built
# into the dependency graph wherever meta-oeros needs them, and the signature
# check still catches meta-oeros changing oe-core recipes.

# Oeros builds with commercial license flags accepted
# (conf/fragments/allow-commercial-licenses.conf); several ROS and multimedia
# dependencies need ffmpeg, which is skipped without them.
LICENSE_FLAGS_ACCEPTED += "commercial synaptics-killswitch"

# test_world_inherit_class parses every recipe in every layer with
# yocto-check-layer.bbclass, which fails any recipe whose tasks after do_fetch
# have network access. These meta-python-ai (wrynose) recipes enable network
# in do_compile to fetch Rust/Go dependencies at build time. Oeros doesn't use
# them, so mask them out of the check rather than fail meta-oeros for them.
BBMASK += " \
    meta-python-ai/recipes-python/obstore/ \
    meta-python-ai/recipes-python/polars/ \
    meta-python-ai/recipes-python/rawpy/ \
    meta-python-ai/recipes-support/mediamtx/ \
"
