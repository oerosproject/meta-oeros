# Runs the Yocto Project's yocto-check-layer script against meta-oeros.
#
# The layers are set up with bitbake-setup from the same configuration Oeros
# is built with, using this checkout of meta-oeros instead of cloning it.
# yocto-check-layer only parses recipes and computes task signatures, so
# nothing is fetched or built; the only thing worth caching is bitbake-setup's
# download directory, which holds the layer git mirrors.
name: yocto-check-layer

on:
  pull_request:
  push:
    branches: [wrynose]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # bitbake-setup configuration file and the configuration in it to check with
  OEROS_CONFIG: conf/registry/configurations/oeros-wrynose-lyrical.conf.json
  OEROS_CONFIG_NAME: oeros-wrynose-lyrical
  # bitbake-setup from PyPI; it fetches the bitbake the configuration asks for
  BITBAKE_SETUP_VERSION: "2.19.0"

jobs:
  yocto-check-layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out meta-oeros
        uses: actions/checkout@v4
        with:
          path: meta-oeros

      - name: Install build host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential chrpath cpio debianutils diffstat file gawk gcc \
            git iputils-ping jq libacl1 liblz4-tool locales python3 \
            python3-git python3-jinja2 python3-pexpect python3-subunit \
            socat texinfo unzip wget xz-utils zstd
          sudo locale-gen en_US.UTF-8
          # BitBake needs unprivileged user namespaces, which Ubuntu 24.04
          # restricts through AppArmor by default
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check the configuration matches LAYERSERIES_COMPAT
        run: |
          config="meta-oeros/$OEROS_CONFIG"
          compat=$(sed -n 's/^LAYERSERIES_COMPAT_oeros *= *"\(.*\)"/\1/p' meta-oeros/conf/layer.conf)
          core_branch=$(jq -r '.sources["openembedded-core"]["git-remote"].branch' "$config")
          if ! grep -qw "$core_branch" <<<"$compat"; then
            echo "::error::$OEROS_CONFIG uses openembedded-core $core_branch but LAYERSERIES_COMPAT_oeros is \"$compat\""
            exit 1
          fi

      - name: Install bitbake-setup
        run: pipx install "bitbake-setup==$BITBAKE_SETUP_VERSION"

      - name: Restore bitbake-setup downloads
        uses: actions/cache@v4
        with:
          path: bitbake-builds/.bitbake-setup-downloads
          key: bitbake-setup-${{ hashFiles('meta-oeros/conf/registry/configurations/*.json') }}-${{ github.run_id }}
          restore-keys: |
            bitbake-setup-${{ hashFiles('meta-oeros/conf/registry/configurations/*.json') }}-
            bitbake-setup-

      - name: Set up layers with bitbake-setup
        run: |
          # DISTRO is left unselected: yocto-check-layer checks that adding
          # meta-oeros alone changes nothing, so the baseline can't already be
          # using the oeros distro
          bitbake-setup init --non-interactive --no-init-vscode \
            --setup-dir-name oeros \
            --use-local-source meta-oeros "$GITHUB_WORKSPACE/meta-oeros" \
            --skip-selection distro \
            "meta-oeros/$OEROS_CONFIG" "$OEROS_CONFIG_NAME" machine/qemux86-64

      - name: Run yocto-check-layer
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          setup="$GITHUB_WORKSPACE/bitbake-builds/oeros"

          # yocto-check-layer adds the layer under test itself, and refuses to
          # run if it's already in BBLAYERS
          sed -i '\#/layers/meta-oeros \\$#d' "$setup/build/conf/bblayers.conf"
          cat "$setup/build/conf/bblayers.conf"
          if grep -q '/layers/meta-oeros\b' "$setup/build/conf/bblayers.conf"; then
            echo "::error::meta-oeros is still in bblayers.conf"
            exit 1
          fi

          # Every layer bitbake-setup cloned (meta-oeros is a symlink, which
          # find doesn't follow), so LAYERDEPENDS can be resolved. Layers are
          # passed by exact path with --no-auto, because auto-detection also
          # picks up recipe directories that happen to contain conf/.
          mapfile -t dependencies < <(find "$setup/layers" -path "$setup/layers/bitbake" -prune \
              -o -path "$setup/layers/openembedded-core" -prune \
              -o -path '*/conf/layer.conf' -print | sed 's|/conf/layer.conf$||' | sort)

          source "$setup/build/init-build-env"
          cat "$GITHUB_WORKSPACE/meta-oeros/.github/yocto-check-layer/local.conf" >> conf/local.conf
          # Keep every layer other than oe-core and meta-oeros out of world
          # (see .github/yocto-check-layer/local.conf)
          for layer in "${dependencies[@]}"; do
            sed -n 's/^BBFILE_COLLECTIONS *+= *" *\([^" ]*\) *"/EXCLUDE_FROM_WORLD:layer-\1 = "1"/p' "$layer/conf/layer.conf"
          done | tee -a conf/local.conf

          yocto-check-layer \
            --no-auto \
            --no-auto-dependency \
            --output-log "$GITHUB_WORKSPACE/yocto-check-layer.log" \
            --dependency "${dependencies[@]}" \
            -- "$GITHUB_WORKSPACE/meta-oeros"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yocto-check-layer-log
          path: yocto-check-layer.log
          if-no-files-found: ignore
